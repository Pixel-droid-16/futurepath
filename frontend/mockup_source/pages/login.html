<sc-if value="{{ is_login }}" hint-placeholder-val="{{ false }}"><main data-screen-label="Login" style="flex:1;display:flex;flex-direction:column"><section style="flex:1;background:var(--hero);display:flex;align-items:center;justify-content:center;padding:56px clamp(16px,4vw,48px)">
<div style="width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px">
<div style="background:var(--sf);border:1px solid var(--ln);border-radius:24px;box-shadow:var(--sh);padding:clamp(24px,4vw,36px);display:flex;flex-direction:column;gap:20px">
<div style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><span style="font-weight:800;font-size:22px;letter-spacing:-.04em">future<span style="color:var(--pr)">path</span></span><h1 style="margin:8px 0 0;font-size:28px;line-height:1.15;letter-spacing:-.03em;font-weight:700">{{ authTitle }}</h1><p style="margin:0;font-size:15px;line-height:1.5;color:var(--mu)">{{ authSub }}</p></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:4px"><button onClick="{{ setLogin }}" style="border:0;border-radius:9px;padding:10px;font:600 14px Geist;cursor:pointer;background:{{ loginBg }};color:{{ loginFg }}">Log in</button><button onClick="{{ setRegister }}" style="border:0;border-radius:9px;padding:10px;font:600 14px Geist;cursor:pointer;background:{{ regBg }};color:{{ regFg }}">Create account</button></div>
<button style="display:flex;align-items:center;justify-content:center;gap:10px;background:var(--sf);border:1.5px solid var(--ln);color:var(--ink);border-radius:12px;padding:12px 20px;font:600 15px Geist;cursor:pointer"><span style="font:800 16px Geist;color:#4285F4">G</span>Continue with Google</button>
<div style="display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mu)"><span style="flex:1;height:1px;background:var(--ln)"></span>or with email<span style="flex:1;height:1px;background:var(--ln)"></span></div>
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}"><label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500">Profile name<input placeholder="A nickname is fine" style="width:100%;border:1px solid var(--ln);border-radius:12px;padding:13px 14px;font:400 15px Geist;background:var(--bg);color:var(--ink)"></label></sc-if>
<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500">Email<input type="email" placeholder="you@example.com" style="width:100%;border:1px solid var(--ln);border-radius:12px;padding:13px 14px;font:400 15px Geist;background:var(--bg);color:var(--ink)"></label>
<label style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500"><span style="display:flex;justify-content:space-between;align-items:baseline">Password<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}"><a style="color:var(--pr);font-weight:600;font-size:13px">Forgot?</a></sc-if></span><span style="position:relative;display:block"><input type="{{ pwType }}" placeholder="Enter password" style="width:100%;border:1px solid var(--ln);border-radius:12px;padding:13px 14px;font:400 15px Geist;background:var(--bg);color:var(--ink);padding-right:64px"><button onClick="{{ togglePw }}" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--pr);font:600 13px Geist;cursor:pointer;padding:6px">{{ pwLbl }}</button></span></label>
<sc-if value="{{ isRegister }}" hint-placeholder-val="{{ false }}"><label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mu);line-height:1.45"><input type="checkbox" style="margin-top:2px">Email me when new signals change my ranking.</label></sc-if>
<a onClick="{{ goResults }}" style="background:var(--pr);color:var(--pri);border-radius:12px;padding:14px 20px;font-size:15px;font-weight:600;text-align:center">{{ authCta }}</a>
<p style="margin:0;font-size:14px;color:var(--mu);text-align:center">{{ authSwitchText }} <a onClick="{{ switchAuth }}" style="color:var(--pr);font-weight:600">{{ authSwitchLink }}</a></p></div>
<p style="margin:0;text-align:center;font-size:13px;line-height:1.5;color:var(--mu)">No account needed to explore. <a onClick="{{ goIntake }}" style="color:var(--pr);font-weight:600">Start without one →</a></p></div></section></main></sc-if>

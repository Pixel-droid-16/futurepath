name: Daily verified Signals snapshot

on:
  schedule:
    # 10:17 am in Malaysia. Cron scheduling is best-effort.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futurepath-signals-snapshot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check trusted feeds and conditionally validate via AI
        env:
          FUTUREPATH_PUBLIC_DEMO: '0'
          SIGNALS_REFRESH_HOURS: '0'
          SIGNALS_AUTO_AI_ENABLED: ${{ vars.SIGNALS_AUTO_AI_ENABLED || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_live_signals.py
      - name: Commit versioned evidence on successful check
        run: |
          if git diff --quiet -- data/live_signals.json; then
            echo "No change to saved evidence"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_signals.json
          git commit -m "data(signals): scheduled evidence check"
          git pull --rebase origin main
          git push origin HEAD:main
